name = "fleet-sizing-leaderboard"
main = "worker.js"
compatibility_date = "2024-11-01"

# Almacenamiento persistente. Sin esto el ranking vive en memoria del isolate
# y se pierde solo; sirve para probar, no para uso real.
#   npx wrangler kv namespace create LEADERBOARD_KV
# Copia el id que imprime y descomenta:
# [[kv_namespaces]]
# binding = "LEADERBOARD_KV"
# id = "PEGA_AQUI_EL_ID"

# El secreto de administrador NO va en este archivo (se versiona). Se sube con:
#   npx wrangler secret put ADMIN_SECRET
